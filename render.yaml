services:
  - type: web
    name: mentora-consciente
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSIST_DIR
        value: /opt/render/project/src/storage
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
    disk:
      name: campus-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1

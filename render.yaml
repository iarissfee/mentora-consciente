services:
  - type: web
    name: mentora-consciente-acceso
    runtime: static
    buildCommand: echo "Pantalla de acceso Mentora Consciente lista"
    staticPublishPath: public-wakeup
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
